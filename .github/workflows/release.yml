name: CI
on: [push]

jobs:
  build:
    name: Build ${{ matrix.target }} for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    container: niceluigi/apotris:latest
    strategy:
      matrix:
        include:
        - target: gba
          platform: Game Boy Advance
          cross_file: meson/gba.ini
        - target: switch
          platform: Nintendo Switch
          cross_file: meson/switch.ini
          build_flags: --reconfigure -Db_lto=false --buildtype=release
          env:
            PATH: /usr/bin:/bin:/opt/devkitpro/tools/bin:$PATH
        - target: linux
          platform: x86_64
        - target: win32
          platform: MinGW x86_64
          cross_file: meson/mingw.ini
        - target: win64
          platform: MinGW x86
          cross_file: meson/mingw32.ini
        - target: web
          platform: HTML5+JS
          cross_file: meson/emscripten.ini
          build_flags: --reconfigure -Db_lto=false --buildtype=release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build for ${{ matrix.target }}
        shell: bash
        env: ${{ matrix.env }}
        run: |
          # Configure build
          if [[ "${{ matrix.target }}" == "web" ]]; then
            source "/root/emsdk/emsdk_env.sh"
            meson setup ${{ matrix.build_flags }} --cross-file=${{ matrix.cross_file }} build-web
            ninja -C build-web || true
            /root/emsdk/upstream/emscripten/emcc -c /root/emsdk/upstream/emscripten/cache/ports/sdl2_mixer/SDL_mixer-release-2.8.0/src/effects_internal.c -o /root/emsdk/upstream/emscripten/cache/ports-builds/sdl2_mixer/src/effects_internal.c.o -g -sSTRICT -Werror -O2 -I/root/emsdk/upstream/emscripten/cache/ports/sdl2_mixer/SDL_mixer-release-2.8.0 -sUSE_SDL=2 -O2 -DMUSIC_WAV -sUSE_VORBIS -DMUSIC_OGG -I/root/emsdk/upstream/emscripten/cache/ports/sdl2_mixer/SDL_mixer-release-2.8.0/include -I/root/emsdk/upstream/emscripten/cache/ports/sdl2_mixer/SDL_mixer-release-2.8.0/src -I/root/emsdk/upstream/emscripten/cache/ports/sdl2_mixer/SDL_mixer-release-2.8.0/src/codecs
          else
            cross_file_arg=""
            if [[ -n "${{ matrix.cross_file }}" ]]; then
              cross_file_arg="--cross-file=${{ matrix.cross_file }}"
            fi
            meson setup ${{ matrix.build_flags }} $cross_file_arg build-${{ matrix.target }}
            meson compile -C build-${{ matrix.target }}
          fi
